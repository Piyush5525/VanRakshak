<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAKSHAK · Forest Intelligence Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script>
  <link rel="stylesheet" href="/assets/styles.css" />
  <link rel="stylesheet" href="/assets/rakshak.css" />
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Primary">
      <div class="brand"><div class="brand-mark">R</div><div><strong>RAKSHAK</strong><span>forest intelligence</span></div></div>
      <nav class="nav" id="nav" aria-label="Main navigation"></nav>
      <div class="sidebar-spacer"></div>
      <div class="trust-card"><div class="eyebrow">Evidence first</div><p>Observations, inferences, forecasts, simulations and human decisions are always labelled apart.</p><div class="mini-status"><span class="status-dot green"></span><span id="modeLabel">Checking…</span></div></div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div class="topbar-left"><button class="icon-button menu-btn" id="menuBtn" aria-label="Open navigation">☰</button>
          <div><div class="breadcrumb">RAKSHAK / <span id="crumb">Overview</span></div><h1 id="pageTitle">Overview</h1></div></div>
        <div class="top-actions">
          <div class="live-chip" id="healthChip"><span class="pulse"></span> <span id="healthText">Connecting…</span></div>
          <select id="roleSelect" aria-label="Active role (development)">
            <option value="reviewer">Reviewer</option><option value="admin">Administrator</option><option value="officer">Forest officer / ranger</option><option value="analyst">Environmental analyst</option><option value="read_only">Read-only viewer</option>
          </select>
          <button class="button subtle" id="tokenBtn" title="Use a bearer token instead of the development role header">Token</button>
        </div>
      </header>
      <div id="banner" class="banner" hidden></div>
      <section id="view" tabindex="-1" aria-live="polite"></section>
    </main>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <dialog id="dialog"><form method="dialog" id="dialogForm"></form></dialog>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script type="module" src="/assets/js/main.js"></script>
</body>
</html>
