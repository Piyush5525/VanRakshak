<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VanRakshak · Forest protection</title>
  <meta name="description" content="Live forest-fire map of India, incident marking and reports. Built on NASA FIRMS, Sentinel-1 and Sentinel-2.">
  <link rel="icon" href="/assets/public/logo.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}body{margin:0;font:16px/1.5 'DM Sans',sans-serif;color:#1b2924;background:linear-gradient(160deg,#f3f8f4 0%,#e1efe6 100%);min-height:100vh;padding:24px}
    main{max-width:980px;margin:0 auto;text-align:center;padding:34px 0 24px}img{width:96px;height:96px}h1{font:700 48px/1.1 'Space Grotesk',sans-serif;color:#14573c;margin:14px 0 8px}p{color:#4c6258;font-size:18px;margin:0 auto 30px;max-width:560px}
    .row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}a.b{display:inline-block;padding:16px 28px;border-radius:12px;font-weight:700;text-decoration:none;font-size:17px}
    a.primary{background:#14573c;color:#fff;box-shadow:0 8px 24px rgba(20,87,60,.28)}a.primary:hover{background:#0f4630}a.ghost{background:#fff;color:#14573c;border:1px solid #c9ddd1}a.ghost:hover{background:#f3f8f4}
    small{display:block;margin-top:34px;color:#74877d;font-size:13px}@media(max-width:520px){h1{font-size:34px}}
  </style>
</head>
<body>
  <main>
    <img src="/assets/public/logo.svg" alt="VanRakshak logo">
    <h1>VanRakshak</h1>
    <p>See where fires are burning across India right now, mark incidents, and generate a report in a click.</p>
    <div class="row"><a class="b primary" href="/live">Open live map</a><a class="b ghost" href="/app">Full console</a></div>
    <small>Fire data: NASA FIRMS. Imagery: Sentinel-1 and Sentinel-2. Decision support only: hotspots are not confirmed wildfires and nothing here is a legal finding.</small>
  </main>
</body>
</html>
